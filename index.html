<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Break App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone-width column, sticky bottom nav, sheets slide up from the bottom. Deliberately dark-only. */
:root {
  --bg: #0d0d0f; --s1: #16161a; --s2: #1f1f25; --s3: #292930; --line: #2e2e36;
  --fg: #f3f3ee; --mut: #8f8f99; --acc: #e8ff3a; --acc-ink: #141600; --acc2: #ff6b1a;
  --good: #3ddc97; --bad: #ff5468; --warn: #ffb547;
  --a-toprock: #ff6b1a; --a-footwork: #e8ff3a; --a-power: #8b8cff; --a-freeze: #3dd6f5; --a-other: #6c6c76;
  --display: 'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 16px; --r-sm: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 14px; }
.h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: .95; letter-spacing: .5px; margin: 0; text-wrap: balance; }
.h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; letter-spacing: .4px; margin: 0; }
.h3 { font-size: 17px; font-weight: 700; margin: 2px 0 0; }
.h4 { font-size: 13px; font-weight: 700; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--mut); }
.muted { color: var(--mut); } .small { font-size: 13px; } .tab { font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); } .acc { color: var(--acc); }
.row { display: flex; align-items: center; } .between { justify-content: space-between; } .start { align-items: flex-start; }
.wrap { flex-wrap: wrap; } .gap4 { gap: 4px; } .gap8 { gap: 8px; } .grow { flex: 1; min-width: 0; } .full { width: 100%; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.divider { height: 1px; background: var(--line); margin: 4px 0; }

.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.banner { background: color-mix(in srgb, var(--acc) 10%, var(--s1)); border: 1px solid color-mix(in srgb, var(--acc) 35%, transparent); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--s2); font-weight: 600; font-size: 15px; text-decoration: none; transition: transform .12s, background .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.big { min-height: 56px; font-size: 17px; }
.btn-acc { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #1a0004; }
.btn-danger-ghost { background: transparent; border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.icon-btn { width: 48px; height: 48px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--s1); flex: none; }
.icon-btn.sm { width: 36px; height: 36px; border-color: transparent; background: var(--s2); }
.icon-btn.flip svg { transform: scaleX(-1); }
.link-btn { background: none; border: 0; color: var(--mut); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; align-self: flex-start; min-height: 32px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--s2); font-size: 12px; font-weight: 600; }
.pill-good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.tag, .tag-orig { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; vertical-align: 2px; background: var(--s3); color: var(--mut); }
.tag-orig { background: color-mix(in srgb, var(--acc2) 22%, transparent); color: var(--acc2); }

.inp { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--s2); outline: none; }
.inp:focus { border-color: var(--acc); }
.inp.ta { min-height: 72px; resize: vertical; }
.inp-flat { min-height: 40px; background: transparent; border-color: transparent; font-weight: 700; padding-left: 0; }
.inp-tr { min-height: 36px; font-size: 13px; border-style: dashed; background: transparent; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 600; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; }
.field-hint { font-size: 12px; color: var(--mut); }
.toggle { display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--acc); }

.seg { display: flex; background: var(--s1); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--mut); padding: 0 4px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: var(--fg); color: var(--bg); }
.seg-sm button { min-height: 36px; font-size: 13px; }
.chips, .tabs-scroll { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--fg); }
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.chip.static { display: inline-flex; align-items: center; cursor: default; }
.chip-add { display: inline-grid; place-items: center; padding: 0 10px; }

.num { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--s2); height: 44px; max-width: 100%; }
.num button { width: 40px; height: 100%; border: 0; background: transparent; font-size: 20px; color: var(--mut); flex: none; }
.num input { width: 52px; text-align: center; border: 0; background: transparent; outline: none; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }
.num-suf { font-size: 12px; color: var(--mut); padding-right: 2px; }
.rate { display: flex; align-items: center; gap: 12px; }
.rate input { flex: 1; accent-color: var(--acc); height: 32px; min-width: 0; }
.rate-v { font-family: var(--display); font-size: 30px; width: 34px; text-align: right; line-height: 1; }

.score { display: inline-grid; place-items: center; font-family: var(--display); line-height: 1; border-radius: 12px; flex: none; font-variant-numeric: tabular-nums; }
.score-md { width: 40px; height: 40px; font-size: 22px; }
.score-lg { width: 52px; height: 52px; font-size: 30px; }
.score-xl { width: 84px; height: 84px; font-size: 54px; border-radius: 18px; }
.score-hi { background: var(--acc); color: var(--acc-ink); }
.score-mid { background: var(--s3); color: var(--fg); }
.score-lo { background: transparent; border: 1px solid var(--line); color: var(--mut); }

.list { display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 60px; padding: 10px 12px; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; }
.li:active { background: var(--s2); }
.li-main { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.li-t { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.li-s { font-size: 12.5px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.li-round { align-items: center; }
.diff { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-size: 20px; flex: none; background: var(--s2); }
.d7, .d8, .d9, .d10 { background: color-mix(in srgb, var(--acc2) 30%, var(--s2)); color: var(--acc2); }
.d4, .d5, .d6 { background: var(--s3); }
.st { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; flex: none; }
.st-no { color: var(--mut); background: transparent; border: 1px solid var(--line); }
.st-learn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.st-can { color: var(--fg); background: var(--s3); }
.st-clean { color: var(--acc-ink); background: var(--acc); }
.mini-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.mini { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--s2); border-radius: 10px; font-size: 14px; }
.kv { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv b { font-family: var(--display); font-size: 22px; font-weight: 400; }

.empty { text-align: center; padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty-t { font-family: var(--display); font-size: 24px; }
.empty p { margin: 0; color: var(--mut); font-size: 14px; max-width: 300px; }

/* Home */
.hero-card { gap: 6px; }
.br-row { display: flex; justify-content: space-between; align-items: flex-start; }
.br-num { font-family: var(--display); font-size: 76px; line-height: .85; color: var(--acc); letter-spacing: 1px; }
.streak { display: flex; align-items: center; gap: 6px; color: var(--acc2); background: color-mix(in srgb, var(--acc2) 12%, transparent); padding: 6px 12px; border-radius: 999px; }
.streak-n { font-family: var(--display); font-size: 24px; line-height: 1; }
.radar { width: 100%; max-width: 300px; margin: 0 auto; display: block; }
.radar-l { fill: var(--mut); font-size: 11px; font-weight: 700; letter-spacing: .1em; font-family: var(--body); }
.radar-v { fill: var(--fg); font-size: 13px; font-weight: 700; font-family: var(--body); }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.stat-row div { display: flex; flex-direction: column; align-items: center; }
.stat-row b { font-family: var(--display); font-size: 28px; font-weight: 400; line-height: 1; }
.stat-row span { font-size: 11px; color: var(--mut); text-align: center; }
.weak-list { display: flex; flex-direction: column; gap: 12px; }
.weak { display: flex; flex-direction: column; gap: 8px; }
.meter { height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.meter.sm { height: 4px; flex: 1; }
.meter span { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.parts { display: flex; flex-direction: column; gap: 6px; background: var(--s2); border-radius: 12px; padding: 10px 12px; }
.part-line { display: flex; flex-direction: column; font-size: 14px; }

/* Training */
.week-nav { display: flex; align-items: center; justify-content: space-between; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px; border-radius: 12px; border: 1px solid transparent; background: var(--s1); min-height: 64px; }
.day-w { font-size: 11px; color: var(--mut); font-weight: 600; }
.day-d { font-family: var(--display); font-size: 22px; line-height: 1; color: var(--mut); }
.day.has .day-d { color: var(--fg); }
.day.today { border-color: var(--line); }
.day.on { background: var(--fg); }
.day.on .day-w, .day.on .day-d { color: var(--bg); }
.day-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.day.has .day-dot { background: var(--s3); }
.day-dot.done { background: var(--acc) !important; }
.blocks { display: flex; flex-direction: column; gap: 12px; }
.wblock { display: flex; flex-direction: column; gap: 4px; }
.wblock-t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--acc); margin-bottom: 2px; }
.witem { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.witem:last-child { border-bottom: 0; }
.witem.done span:first-child { text-decoration: line-through; color: var(--mut); }
.note { font-size: 13px; color: var(--mut); background: var(--s2); border-radius: 10px; padding: 8px 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tmpl { display: flex; flex-direction: column; }
.tmpl-row { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tmpl-row:last-child { border-bottom: 0; }
.tmpl-d { font-weight: 700; color: var(--mut); font-size: 13px; }
.eblock { background: var(--s2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.eitem { background: var(--s1); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.eitem-n { font-weight: 600; font-size: 14px; min-width: 0; }
.run-top { display: flex; align-items: center; justify-content: space-between; }
.run-clock { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--acc); }
.progress { height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--acc); transition: width .3s; }
.run-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.run-item.done .li-t { color: var(--mut); text-decoration: line-through; }
.check { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; flex: none; }
.check.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

/* Library */
.gen-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gen { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--s1); font-weight: 600; text-align: left; min-height: 92px; }
.gen svg { color: var(--acc); }
.gen-items { display: flex; flex-wrap: wrap; gap: 6px; }
.gen-it { font-family: var(--display); font-size: 24px; background: var(--s2); padding: 4px 12px; border-radius: 10px; }
.chain { display: flex; flex-direction: column; gap: 6px; }
.chain-step { display: flex; flex-direction: column; gap: 6px; background: var(--s2); padding: 8px 10px; border-radius: 12px; }

/* Rounds */
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--s3); gap: 2px; margin-top: 4px; }
.sbar-p { height: 100%; }
.a-toprock { background: var(--a-toprock); } .a-footwork { background: var(--a-footwork); } .a-power { background: var(--a-power); } .a-freeze { background: var(--a-freeze); } .a-other, .a-physical, .a-music { background: var(--a-other); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mut); margin-top: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.round-sum { display: flex; gap: 14px; align-items: flex-start; background: var(--s2); border-radius: var(--r); padding: 12px; }
.round-score { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.round-calc { text-align: center; line-height: 1.3; }
.timebar { height: 8px; border-radius: 4px; background: var(--s3); overflow: hidden; margin: 4px 0 2px; }
.timebar span { display: block; height: 100%; background: var(--fg); }
.timebar span.over { background: var(--bad); }
.warns { margin: 0; padding: 10px 12px 10px 28px; background: color-mix(in srgb, var(--warn) 9%, transparent); border-radius: 12px; color: var(--warn); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.rblocks { display: flex; flex-direction: column; gap: 6px; }
.rblock { background: var(--s1); border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; overflow: hidden; }
.a-border-toprock { border-left-color: var(--a-toprock); } .a-border-footwork { border-left-color: var(--a-footwork); } .a-border-power { border-left-color: var(--a-power); } .a-border-freeze { border-left-color: var(--a-freeze); } .a-border-other, .a-border-undefined { border-left-color: var(--a-other); }
.rblock-main { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: transparent; border: 0; text-align: left; min-height: 60px; }
.rblock-n { font-family: var(--display); font-size: 20px; color: var(--mut); width: 18px; flex: none; }
.rblock-edit { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); }
.add-block { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border: 2px dashed var(--line); border-radius: 14px; background: transparent; color: var(--acc); font-weight: 700; }

/* Battle */
.result-card.win { border-color: var(--acc); }
.opp-card { border-color: color-mix(in srgb, var(--acc2) 45%, var(--line)); }
.opp-aspects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.opp-a { display: grid; grid-template-columns: 1fr; gap: 3px; }
.opp-a > div, .opp-a .tab { display: inline-block; }
.opp-a { grid-template-columns: 1fr auto; align-items: center; }
.opp-a .small:first-child { grid-column: 1 / -1; color: var(--mut); }
.hidden-v { grid-column: 1 / -1; font-style: italic; }
.bracket-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; }
.bracket { display: grid; gap: 10px; min-width: 100%; }
.b-col { display: flex; flex-direction: column; gap: 6px; }
.b-h { font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .1em; }
.b-matches { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; flex: 1; }
.b-m { background: var(--s1); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.b-p { padding: 6px 9px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-p + .b-p { border-top: 1px solid var(--line); }
.b-p.me { font-weight: 700; color: var(--acc); }
.b-p.won { background: var(--s2); }
.b-p.lost { color: var(--mut); text-decoration: line-through; }
.b-p.empty { color: var(--mut); opacity: .4; }
.vs-rounds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.vs-rounds > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vs-b { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; background: var(--s2); padding: 6px 8px; border-left: 3px solid var(--a-other); border-radius: 6px; }
.vs-b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.judges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.judge { background: var(--s2); border-radius: 14px; padding: 12px 8px; text-align: center; min-height: 116px; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; transition: background .3s, transform .3s; }
.judge-h { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.judge-v { font-family: var(--display); font-size: 26px; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
